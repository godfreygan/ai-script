<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- 青色到紫色的渐变 -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 深色背景圆 -->
  <circle cx="200" cy="170" r="130" fill="#0F172A"/>

  <!-- 外环光晕 -->
  <circle cx="200" cy="170" r="125" fill="none" stroke="url(#cyberGrad)" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="170" r="118" fill="none" stroke="url(#cyberGrad)" stroke-width="0.5" opacity="0.15"/>

  <!-- 神经元网络 -->
  <g stroke="url(#cyberGrad)" fill="none" opacity="0.8">
    <!-- 主神经元节点 -->
    <circle cx="200" cy="170" r="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2" filter="url(#neonGlow)"/>
    <circle cx="200" cy="170" r="5" fill="#06B6D4" stroke="none"/>

    <!-- 第一层节点（6个）-->
    <circle cx="200" cy="110" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="252" cy="140" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="252" cy="200" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="200" cy="230" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="148" cy="200" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="148" cy="140" r="8" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>

    <!-- 连接线 -->
    <path d="M200,170 L200,118" stroke-width="1.5"/>
    <path d="M200,170 L246,144" stroke-width="1.5"/>
    <path d="M200,170 L246,196" stroke-width="1.5"/>
    <path d="M200,170 L200,222" stroke-width="1.5"/>
    <path d="M200,170 L154,196" stroke-width="1.5"/>
    <path d="M200,170 L154,144" stroke-width="1.5"/>

    <!-- 第二层节点 -->
    <circle cx="200" cy="75" r="5" fill="#6366F1" stroke="none"/>
    <circle cx="280" cy="120" r="5" fill="#6366F1" stroke="none"/>
    <circle cx="280" cy="220" r="5" fill="#6366F1" stroke="none"/>
    <circle cx="200" cy="265" r="5" fill="#6366F1" stroke="none"/>
    <circle cx="120" cy="220" r="5" fill="#6366F1" stroke="none"/>
    <circle cx="120" cy="120" r="5" fill="#6366F1" stroke="none"/>

    <!-- 二级连接线 -->
    <path d="M200,110 L200,80" stroke-width="1" opacity="0.6"/>
    <path d="M252,140 L275,123" stroke-width="1" opacity="0.6"/>
    <path d="M252,200 L275,217" stroke-width="1" opacity="0.6"/>
    <path d="M200,230 L200,260" stroke-width="1" opacity="0.6"/>
    <path d="M148,200 L125,217" stroke-width="1" opacity="0.6"/>
    <path d="M148,140 L125,123" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 数据脉冲动画点 -->
  <g fill="#06B6D4" filter="url(#neonGlow)">
    <circle cx="200" cy="145" r="2.5">
      <animate attributeName="cy" values="170;110;170" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="157" r="2.5">
      <animate attributeName="cx" values="200;252;200" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;140;170" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="183" r="2.5">
      <animate attributeName="cx" values="200;252;200" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="170;200;170" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 文字 -->
  <text x="200" y="355" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="38" font-weight="800" fill="#0F172A" letter-spacing="2">ai-script</text>
  <text x="200" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="12" font-weight="400" fill="#6366F1" letter-spacing="8">智能短剧生成</text>
</svg>