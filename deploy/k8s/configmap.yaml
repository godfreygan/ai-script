apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-script-config
  namespace: ai-script
data:
  APP_ENV: "prod"
  APP_PORT: "8080"
  APP_LOG_LEVEL: "info"
  APP_ORIGINS: "https://ai-script.example.com"

  # MySQL
  MYSQL_MAX_IDLE: "10"
  MYSQL_MAX_OPEN: "100"
  MYSQL_CONN_MAX_LIFETIME: "3600"
  MYSQL_CONN_MAX_IDLE_TIME: "1800"

  # Redis
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "5"
  REDIS_POOL_TIMEOUT: "5"

  # Migrate
  MIGRATE_MODE: "auto"

  # Storage (OSS)
  OSS_PROVIDER: "oss"
  OSS_REGION: "cn-hangzhou"
  OSS_BUCKET: "ai-script-prod"
  OSS_PUBLIC_HOST: "/uploads"

  # Timeouts
  TIMEOUTS_IMAGE_GEN_SECONDS: "120"
  TIMEOUTS_VIDEO_GEN_SECONDS: "120"
  TIMEOUTS_VIDEO_COMPOSE_SECONDS: "300"
  TIMEOUTS_MODEL_HEALTH_SECONDS: "30"
  TIMEOUTS_PIPELINE_RUN_SECONDS: "600"

  # JWT
  JWT_EXPIRES_IN: "7200"
  JWT_REFRESH_EXPIRES_IN: "604800"
