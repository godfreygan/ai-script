apiVersion: v1
kind: Secret
metadata:
  name: ai-script-secret
  namespace: ai-script
type: Opaque
# Replace all values with real base64-encoded data before deployment.
# Example: echo -n 'your-value' | base64
data:
  # MySQL DSN
  MYSQL_DSN: "BASE64_ENCODED_MYSQL_DSN"

  # Redis password
  REDIS_PASSWORD: "BASE64_ENCODED_REDIS_PASSWORD"

  # JWT signing secret
  JWT_SECRET: "BASE64_ENCODED_JWT_SECRET"

  # Migration source DSN
  MIGRATE_SOURCE: "BASE64_ENCODED_MIGRATE_SOURCE"

  # OSS / S3 access credentials
  OSS_ENDPOINT: "BASE64_ENCODED_OSS_ENDPOINT"
  OSS_ACCESS_KEY: "BASE64_ENCODED_OSS_ACCESS_KEY"
  OSS_SECRET_KEY: "BASE64_ENCODED_OSS_SECRET_KEY"

  # Data encryption key
  CRYPTO_KEY_BASE64: "BASE64_ENCODED_CRYPTO_KEY_BASE64"

  # Model gateway
  MODEL_GATEWAY_URL: "BASE64_ENCODED_MODEL_GATEWAY_URL"
  MODEL_GATEWAY_KEY: "BASE64_ENCODED_MODEL_GATEWAY_KEY"
