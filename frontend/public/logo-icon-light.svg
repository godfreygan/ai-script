<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Light background circle -->
  <circle cx="100" cy="100" r="95" fill="#F8FAFC"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#cyber)" stroke-width="0.8" opacity="0.35"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#cyber)" stroke-width="0.4" opacity="0.18"/>

  <g stroke="url(#cyber)" fill="none" opacity="0.9">
    <circle cx="100" cy="100" r="10" fill="#F8FAFC" stroke="#06B6D4" stroke-width="2" filter="url(#g)"/>
    <circle cx="100" cy="100" r="4" fill="#06B6D4" stroke="none"/>

    <circle cx="100" cy="55" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="139" cy="77" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="139" cy="123" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="100" cy="145" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="61" cy="123" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="61" cy="77" r="7" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>

    <path d="M100,100 L100,62" stroke-width="1.5"/>
    <path d="M100,100 L133,80" stroke-width="1.5"/>
    <path d="M100,100 L133,120" stroke-width="1.5"/>
    <path d="M100,100 L100,138" stroke-width="1.5"/>
    <path d="M100,100 L67,120" stroke-width="1.5"/>
    <path d="M100,100 L67,80" stroke-width="1.5"/>

    <circle cx="100" cy="28" r="4.5" fill="#6366F1" stroke="none"/>
    <circle cx="162" cy="64" r="4.5" fill="#6366F1" stroke="none"/>
    <circle cx="162" cy="136" r="4.5" fill="#6366F1" stroke="none"/>
    <circle cx="100" cy="172" r="4.5" fill="#6366F1" stroke="none"/>
    <circle cx="38" cy="136" r="4.5" fill="#6366F1" stroke="none"/>
    <circle cx="38" cy="64" r="4.5" fill="#6366F1" stroke="none"/>

    <path d="M100,55 L100,32" stroke-width="1" opacity="0.6"/>
    <path d="M139,77 L158,66" stroke-width="1" opacity="0.6"/>
    <path d="M139,123 L158,134" stroke-width="1" opacity="0.6"/>
    <path d="M100,145 L100,168" stroke-width="1" opacity="0.6"/>
    <path d="M61,123 L42,134" stroke-width="1" opacity="0.6"/>
    <path d="M61,77 L42,66" stroke-width="1" opacity="0.6"/>
  </g>

  <g fill="#06B6D4" filter="url(#g)">
    <circle cx="100" cy="80" r="2">
      <animate attributeName="cy" values="100;55;100" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="90" r="2">
      <animate attributeName="cx" values="100;139;100" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;77;100" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="110" r="2">
      <animate attributeName="cx" values="100;139;100" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;123;100" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>