<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(60,60)">
    <circle cx="0" cy="0" r="50" fill="#0F172A"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#cyber)" stroke-width="0.7" opacity="0.25"/>
    <circle cx="0" cy="0" r="41" fill="none" stroke="url(#cyber)" stroke-width="0.3" opacity="0.12"/>

    <g stroke="url(#cyber)" fill="none" opacity="0.85">
      <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="#06B6D4" stroke-width="1.8" filter="url(#g)"/>
      <circle cx="0" cy="0" r="3" fill="#06B6D4" stroke="none"/>

      <circle cx="0" cy="-30" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="26" cy="-15" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="26" cy="15" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="0" cy="30" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="-26" cy="15" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>
      <circle cx="-26" cy="-15" r="5" fill="#0F172A" stroke="#6366F1" stroke-width="1.2"/>

      <path d="M0,0 L0,-25" stroke-width="1.2"/>
      <path d="M0,0 L22,-13" stroke-width="1.2"/>
      <path d="M0,0 L22,13" stroke-width="1.2"/>
      <path d="M0,0 L0,25" stroke-width="1.2"/>
      <path d="M0,0 L-22,13" stroke-width="1.2"/>
      <path d="M0,0 L-22,-13" stroke-width="1.2"/>

      <circle cx="0" cy="-45" r="3" fill="#6366F1" stroke="none"/>
      <circle cx="39" cy="-22" r="3" fill="#6366F1" stroke="none"/>
      <circle cx="39" cy="22" r="3" fill="#6366F1" stroke="none"/>
      <circle cx="0" cy="45" r="3" fill="#6366F1" stroke="none"/>
      <circle cx="-39" cy="22" r="3" fill="#6366F1" stroke="none"/>
      <circle cx="-39" cy="-22" r="3" fill="#6366F1" stroke="none"/>

      <path d="M0,-30 L0,-42" stroke-width="0.8" opacity="0.55"/>
      <path d="M26,-15 L36,-20" stroke-width="0.8" opacity="0.55"/>
      <path d="M26,15 L36,20" stroke-width="0.8" opacity="0.55"/>
      <path d="M0,30 L0,42" stroke-width="0.8" opacity="0.55"/>
      <path d="M-26,15 L-36,20" stroke-width="0.8" opacity="0.55"/>
      <path d="M-26,-15 L-36,-20" stroke-width="0.8" opacity="0.55"/>
    </g>

    <g fill="#06B6D4" filter="url(#g)">
      <circle cx="0" cy="-16" r="1.5">
        <animate attributeName="cy" values="0;-30;0" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14" cy="-8" r="1.5">
        <animate attributeName="cx" values="0;26;0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="0;-15;0" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Text -->
  <text x="130" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="2">AI SCRIPT</text>
  <text x="130" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#6366F1" letter-spacing="5">AI短剧视频生成平台</text>
</svg>