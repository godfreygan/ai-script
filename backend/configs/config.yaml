app:
  name: ai-script
  env: local
  port: 8080
  log_level: debug
  origins:
    - http://localhost

jwt:
  secret: ${JWT_SECRET}
  access_expires_in: 7200
  refresh_expires_in: 604800

mysql:
  dsn: ${MYSQL_DSN}
  max_idle: 10
  max_open: 100
  conn_max_lifetime_seconds: 3600
  conn_max_idle_time_seconds: 1800

redis:
  addr: 127.0.0.1:6379
  password: ${REDIS_PASSWORD}
  db: 1
  pool_size: 20
  min_idle_conns: 5
  pool_timeout_seconds: 5

migrate:
  mode: auto
  source: ""
  dsn: ""

storage:
  provider: ${OSS_PROVIDER}
  endpoint: ${OSS_ENDPOINT}
  region: ${OSS_REGION}
  bucket: ${OSS_BUCKET}
  access_key: ${OSS_ACCESS_KEY}
  secret_key: ${OSS_SECRET_KEY}
  public_host: ${OSS_PUBLIC_HOST}

crypto:
  key: ${CRYPTO_KEY}
  key_base64: ${CRYPTO_KEY_BASE64}

queue:
  concurrency: 16

model_gateway:
  url: ${MODEL_GATEWAY_URL}
  key: ${MODEL_GATEWAY_KEY}
